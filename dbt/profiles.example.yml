# Copy to ~/.dbt/profiles.yml (never commit real credentials).
hmda_lab:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: hmda_dev
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      location: US
      threads: 4
      maximum_bytes_billed: 50000000000  # 50 GB guardrail per query (free tier: 1 TiB/month)
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: hmda
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      location: US
      threads: 4
      maximum_bytes_billed: 100000000000
